# HeartSafe coordination layer - configuration.
# The agent reads these values; it never edits them. Safeguards approved by an
# administrator live in data/safeguards.json, not here.

cohort:
  patients: 2000
  days: 90
  seed: 7

# Simulated remote-monitoring cohort (modelled on Medly). Every number here is an
# ASSUMPTION for the simulation, stated on the slides; none comes from platform data.
simulation:
  remoteness_mix: [0.5, 0.25, 0.25]          # urban, rural, remote
  missing_rate: {urban: 0.05, rural: 0.10, remote: 0.18}   # days with no reading
  own_scale_share: {urban: 0.5, rural: 0.6, remote: 0.7}
  scale_change_prob: {own_scale: 0.12, provided_kit: 0.04} # per patient over the period
  unit_error_rate: 0.003                     # weight typed in lb instead of kg
  cuff_error_rate: 0.005                     # badly placed BP cuff
  symptom_base_rate: 0.008                   # daily chance of a symptom report without decompensation
  orthopnea_base_rate: 0.004                 # breathless lying flat, without decompensation
  pnd_base_rate: 0.0024                      # woke up breathless at night, without decompensation
  chest_pain_base_rate: 0.0005               # daily chance of chest pain without decompensation
  syncope_base_rate: 0.0003
  diuretic_miss_rate: 0.03                   # daily chance the diuretic is not taken
  diuretic_miss_before_episode: 0.25         # extra in the 5 days before a decompensation
  lab_days_after_discharge: [7, 30, 60]      # potassium and creatinine drawn at the clinic
  episode_early_scale_days: 30               # decompensation risk is highest soon after discharge
  episode_prob: 0.18                         # heart-failure decompensation in the period
  patient:                                   # enrollment record of screened candidates
    nyha_mix: [0.05, 0.45, 0.38, 0.12]       # NYHA I, II, III, IV at discharge
    median_admission_h: 110
    max_days_since_discharge_seen: 21
    caregiver_share: 0.5
    can_self_measure_share: 0.9
    beta_blocker_share: 0.8
    pacemaker_share: 0.25
    af_share: 0.35
    exclusion_rates: {dementia: 0.06, long_term_care: 0.05, palliative: 0.05, transplant_or_lvad: 0.02, dialysis: 0.04}
    # At enrollment the clinician sets personal BP / heart-rate limits when the patient's usual value
    # is within this margin of a default limit (limit = usual value -/+ margin).
    personal_limit_margin: {sbp: 20, hr: 15}
  ecg_kit_share: 0.7                         # patients with a single-lead ECG device
  ecg_quality_beta: {urban: [9, 2], rural: [8, 2], remote: [5, 3]}
  mri_referral_prob: 0.3                     # resolved critical cases sent for cardiac MRI
  # Only when real model outputs are plugged in (--ecg / --imaging): which recording a patient gets.
  ecg_fault_share: {urban: 0.10, rural: 0.15, remote: 0.30}       # ECGs drawn from fault-injected recordings
  regional_scanner_share: {urban: 0.1, rural: 0.5, remote: 0.8}   # MRI on a scanner the model never saw
  mri_fault_share: {urban: 0.05, rural: 0.10, remote: 0.15}       # MRIs drawn from fault-injected exams
  imaging_seen_vendors: [A, B]                                    # M&Ms vendors in nnU-Net training
  # Heart rhythm (ground truth for the ECG the patient records). Own random stream per patient.
  rhythm:
    permanent_af_share: 0.5                  # of patients with AF at enrollment: in AF on every recording
    paroxysmal_af_day_prob: 0.15             # the others: chance of being in AF on a given day
    new_af_prob: 0.04                        # patients WITHOUT known AF who develop it in the period
    new_af_days: [6, 14]                     # how long the new AF lasts in the simulation
    new_af_hr_rise: 18                       # bpm faster while in new AF
    new_af_breathless: 0.35                  # extra daily chance of reporting shortness of breath
  # A few days with the heart rate outside the patient's own limits. Own random stream per patient.
  heart_rate_spells:
    slow_prob: 0.02                          # patients on a beta-blocker without a pacemaker: too slow
    fast_prob: 0.015                         # any patient: too fast
    days: [2, 5]
    breathless: 0.4                          # daily chance of reporting shortness of breath in the spell
  # Patient-reported sleep and breathing-exercise sessions (daily check-in). Own random stream.
  selfcare:
    usual_sleep_h: [6.7, 0.8]                # mean, SD of a patient's usual night
    night_sd_h: 0.7
    poor_sleep_prob: 0.08                    # a spell of poor sleep not caused by decompensation
    poor_sleep_early_scale_days: 20          # most likely in the first weeks after discharge
    poor_sleep_days: [5, 14]
    poor_sleep_loss_h: 2.0
    episode_sleep_loss_h: 1.6                # at the peak of a decompensation
    breathless_night_loss_h: 1.0             # nights with breathlessness lying flat or waking breathless
    breathing_adherence_beta: [4, 2]         # share of planned sessions a patient does

# Who is enrolled. Reviewed with cardiologists (Nov 2026): NYHA class is used because it is
# assessed at the bedside; ejection fraction is not required (it needs an echocardiogram).
# Target: rural and remote patients; urban patients stay in the simulation as the
# comparison group for the equity audit.
inclusion:
  min_age: 18
  min_hf_admission_h: 48             # hospitalised for decompensated heart failure
  max_days_since_discharge: 14
  nyha: [II, III, IV] 
  # Class I (No Limitation): People have heart disease, but ordinary physical activity does not cause undue fatigue, palpitations, or shortness of breath.
  # Class II (Slight Limitation): People are comfortable at rest, but ordinary physical activity results in fatigue, heart palpitations, or shortness of breath.
  # Class III (Marked Limitation): People are comfortable at rest, but less-than-ordinary physical activity (such as walking short distances or light daily chores) causes noticeable symptoms.
  # Class IV (Severe Limitation): People are unable to carry on any physical activity without discomfort, and heart failure symptoms are present even while at rest.
  remoteness: [urban, rural, remote]
  exclude: [dementia, long_term_care, palliative, transplant_or_lvad, dialysis]

# Platform alert rules (modelled on Medly). Medly's own clinically validated algorithm is not
# public; these follow common heart-failure telemonitoring thresholds and were reviewed with
# cardiologists (Nov 2026). BP / heart-rate limits are defaults: the clinician can set
# sbp_low, sbp_high, dbp_high, hr_low, hr_high per patient at enrollment (patients table).
alert_rules:
  weight_gain_2d_kg: 1.5
  weight_gain_7d_kg: 2.5
  weight_gain_critical_kg: 3.5
  sbp_low: 90
  sbp_high: 180
  dbp_high: 110                      # critical
  hr_low: 45
  hr_high: 120
  spo2_caution: 93                   # below -> caution
  spo2_critical: 90                  # below -> critical
  missed_diuretic_days: 2            # consecutive days -> caution
  potassium_caution: [3.5, 5.5]      # mmol/L, outside -> caution
  potassium_critical: [3.0, 6.0]     # outside -> critical
  creatinine_rise_umol: 26.5         # above the enrollment value (= 0.3 mg/dL) -> caution
  # chest pain or fainting -> critical; breathless lying flat or at night -> caution
  # (critical together with a weight-gain rule, like shortness of breath)

reliability:
  weight_plausible_kg: [30, 250]
  sbp_plausible: [60, 250]
  dbp_plausible: [30, 150]
  spo2_plausible: [70, 100]
  hr_plausible: [25, 220]
  unit_error_ratio: [1.9, 2.5]       # today / recent median, weight entered in lb
  step_change_kg: 1.8                # one-day jump that suggests a new scale (a nurse verifies it)
  step_persist_tolerance_kg: 1.0
  cuff_jump_mmhg: 30
  hr_stable_bpm: 10
  stale_min_readings_7d: 4
  missing_outreach_days: 3           # consecutive missed days -> outreach task
  ecg_min_quality: 0.6
  ecg_max_uncertainty: 0.35
  ecg_abnormal_prob: 0.5

# When patients with an ECG device record one. Every recording is checked (quality first),
# not only those on alert days. Reviewed with cardiologists (Nov 2026).
ecg_protocol:
  routine_every_days: 7              # a routine recording once a week
  on_symptoms: true                  # and whenever they report a symptom
  on_alert: true                     # and when the platform alerts (the agent asks for one)

# Named rhythm findings from a reliable single-lead ECG (asked for in the cardiologist review, Nov 2026):
# atrial fibrillation from the 3-class rhythm model (normal / AF / other abnormal), and
# bradycardia / tachycardia from the R-peak heart rate against the patient's own limits
# (hr_low / hr_high from enrollment, else the alert_rules defaults).
# AF in a patient with atrial_fibrillation at enrollment is known, not new: logged, not escalated.
ecg_rhythm:
  af_min_prob: 0.5                   # AF probability needed to name it
  new_af_with_symptoms: critical     # new AF and a reported symptom the same day
  new_af_without_symptoms: caution
  # Known AF makes every recording abnormal, so it is no new evidence. Two choices for the
  # cardiologist (results.rhythm reports how often each one matters):
  known_af_triggers_emergency: true        # chest pain or fainting + known AF on the ECG -> emergency (rule unchanged)
  known_af_upgrades_with_symptoms: false   # a caution alert with symptoms + known AF on the ECG -> critical

# Emergency level, above critical (cardiologist review, Nov 2026): chest pain or fainting AND a
# reliable abnormal ECG at the same time. A clinician starts a video call within 15 minutes and
# records "call 911" or "cancel the alarm" with a reason. HeartSafe never calls 911 itself.
# Chest pain or fainting without an abnormal ECG stays critical.
emergency:
  symptoms: [chest_pain, syncope]
  patient_message: "If you feel worse, call 911."

followup:
  ack_deadline_h: {emergency: 0.25, critical: 4, caution: 24, low: 72}   # emergency = 15 min to start the video call
  resolve_deadline_h: {emergency: 1, critical: 48, caution: 120, low: 168}
  watch_every_h: 2                   # follow-up watch: how often every case and patient loop is checked

# Patient loop: after a clinician resolves a clinical case, HeartSafe sends the instruction,
# waits for the patient to confirm and act, contacts a caregiver or community health worker
# when they do not, and checks the readings afterwards (reopens if they did not improve).
# Response numbers are ASSUMPTIONS for the simulation.
patient_loop:
  confirm_deadline_h: {critical: 2, caution: 12}
  action_deadline_h: {critical: 6, caution: 48}
  outcome_check_after_h: 24          # readings checked this long after the action (cardiologist review: 24 h)
  patient_median_confirm_h: {urban: 1.5, rural: 3, remote: 6}
  patient_no_response: {urban: 0.08, rural: 0.15, remote: 0.25}   # no signal, phone off, missed message
  helper_median_confirm_h: 3         # caregiver or community health worker, once contacted
  helper_window_h: 8                 # time given to each helper before the next contact
  helper_reach: 0.85
  median_action_h: {critical: 2, caution: 12}
  action_not_done: 0.12              # confirms but does not act on the first message
  action_after_reminder: 0.7
  safeguard_factor: 0.5              # approved safeguard: contact helpers twice as early

# Assumed clinician response model for the simulation (same for both arms).
clinicians:
  median_ack_h:
    emergency: {urban: 0.08, rural: 0.1, remote: 0.12}   # on-call clinician is paged and starts the video call
    critical: {urban: 2, rural: 3, remote: 5}
    caution: {urban: 10, rural: 14, remote: 22}
    low: {urban: 24, rural: 30, remote: 40}
  ack_sigma: 0.8
  forget_prob: 0.10              # alert/case slips through without tracking
  ignore_reminder_prob: 0.2      # first reminder missed -> goes to backup clinician
  response_after_reminder_h: 2
  emergency_response_after_reminder_h: 0.1   # on-call answers a 15-minute reminder within minutes
  median_resolve_after_ack_h: {emergency: 0.25, critical: 12, caution: 36, low: 48}

# Self-care the patient logs every day: last night's sleep and breathing-exercise sessions.
# Sleep is compared with the patient's OWN usual sleep (median of their earlier nights).
# Worse sleep alone never raises a clinical alert: it opens a low-priority check-in call and is
# shown in every review. The breathing plan comes from the care team; HeartSafe only counts sessions.
selfcare:
  sleep:
    window_nights: 3                 # the last nights looked at
    min_usual_nights: 4              # earlier nights needed to know the usual sleep
    each_night_h: 1.0                # every one of those nights at least this far below the usual, and
    drop_h: 1.5                      # their average this far below the usual
    short_h: 4.5                     # (or their average under this many hours)
    repeat_after_days: 21            # at most one sleep check-in per patient in this time
  breathing:
    sessions_per_day: 3              # the care team's plan
    exercises:
      slow: {name: "Slow breathing", in_s: 4, hold_s: 0, out_s: 6}
      deep: {name: "Deep breathing with a pause", in_s: 4, hold_s: 2, out_s: 6}

equity:
  groups: [remoteness, sex, age_band, device]
  min_n: 30
  n_boot: 1000
  tighter_deadline_factor: 0.5

# Reviews are written from templates (no LLM needed). The Claude-written review is future
# work: off by default; set llm_enabled: true and ANTHROPIC_API_KEY to try it in the dashboard.
review:
  llm_enabled: false
  llm_model: claude-sonnet-5-5
  lvef_bands: {reduced_max: 40, mildly_reduced_max: 49}   # % (universal definition of heart failure)
